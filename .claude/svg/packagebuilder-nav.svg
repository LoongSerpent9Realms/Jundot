<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* === 色板（WinForms .NET 8 桌面 App 风格）=== */
      .bg-window     { fill: #f0f0f3; }
      .bg-titlebar   { fill: #ffffff; }
      .bg-nav        { fill: #ffffff; }
      .bg-content    { fill: #f7f7fa; }
      .bg-card       { fill: #ffffff; }

      .border-window { stroke: #d0d0d8; stroke-width: 1; fill: none; }
      .border-card   { stroke: #e2e2e8; stroke-width: 1; }
      .separator     { stroke: #e8e8ee; stroke-width: 1; }

      .brand-active  { fill: #2563eb; }          /* 选中导航按钮蓝底 */
      .brand-active-text { fill: #ffffff; }       /* 选中按钮白字 */
      .nav-default-text  { fill: #5f6368; }       /* 未选中按钮灰字 */
      .nav-hover-bg  { fill: #e8eaf0; }           /* 未选中按钮悬停背景 */

      .ink-1 { fill: #1f1f1f; }   /* 主文字 */
      .ink-2 { fill: #3c4043; }   /* 次文字（标签名） */
      .ink-3 { fill: #80868b; }   /* placeholder / 辅助文字 */
      .ink-4 { fill: #5f6368; }   /* 弱文字 */

      .accent { fill: #2563eb; }  /* 强调色 */
      .ok     { fill: #1b8a3d; }
      .warn   { fill: #e37400; }
      .err    { fill: #d93025; }

      text { font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
      .mono { font-family: 'Consolas', 'Menlo', 'Courier New', monospace; }

      .title-text      { font-size: 13px; font-weight: 600; fill: #1f1f1f; }
      .nav-btn-text    { font-size: 13px; font-weight: 500; }
      .section-title   { font-size: 14px; font-weight: 700; fill: #1f1f1f; }
      .label-text      { font-size: 12px; fill: #3c4043; }
      .value-text      { font-size: 12px; fill: #1f1f1f; }
      .hint-text       { font-size: 11px; fill: #80868b; }
      .badge-text      { font-size: 11px; font-weight: 600; }

      .btn-primary     { fill: #2563eb; rx: 6; }
      .btn-primary-text{ font-size: 12px; font-weight: 600; fill: #ffffff; }
      .btn-ghost       { fill: #ffffff; stroke: #d0d0d8; stroke-width: 1; rx: 6; }
      .btn-ghost-text  { font-size: 12px; fill: #3c4043; }

      .combo-bg        { fill: #ffffff; stroke: #d0d0d8; stroke-width: 1; rx: 4; }
      .combo-text      { font-size: 12px; fill: #1f1f1f; }
      .combo-arrow     { fill: #80868b; }
      .input-bg        { fill: #ffffff; stroke: #d0d0d8; stroke-width: 1; rx: 4; }

      .checkbox-box    { fill: #ffffff; stroke: #80868b; stroke-width: 1.5; rx: 3; }
      .checkbox-checked{ fill: #2563eb; stroke: #2563eb; stroke-width: 1.5; rx: 3; }
      .checkbox-check  { stroke: #ffffff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

      .nav-indicator   { fill: #2563eb; }  /* 选中按钮底部指示条 */

      .badge-editor    { fill: #e8f0fe; stroke: #a8c8fa; stroke-width: 1; rx: 4; }

      .grid-header-bg  { fill: #f0f0f3; }
      .grid-header-text{ font-size: 11px; font-weight: 600; fill: #5f6368; }
      .grid-row-bg     { fill: #ffffff; }
      .grid-row-alt    { fill: #fafafc; }
      .grid-row-text   { font-size: 12px; fill: #1f1f1f; }
      .grid-row-mono   { font-size: 11px; fill: #3c4043; font-family: 'Consolas', 'Menlo', monospace; }
    </style>

    <!-- 下拉箭头图标 -->
    <symbol id="chevron-down" viewBox="0 0 12 12">
      <path d="M3 5l3 3 3-3" stroke="#80868b" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 勾选图标 -->
    <symbol id="check" viewBox="0 0 10 8">
      <path d="M1 4l3 3 5-6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- ============== 窗口背景 ============== -->
  <rect width="960" height="720" class="bg-window" rx="0"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="960" height="32" class="bg-titlebar"/>
  <rect x="0" y="32" width="960" height="1" class="separator"/>
  <text x="12" y="21" class="label-text" style="font-size: 12px;">Godot Package Builder</text>

  <!-- ============== 导航栏 ============== -->
  <rect x="0" y="33" width="960" height="48" class="bg-nav"/>
  <rect x="0" y="81" width="960" height="1" class="separator"/>

  <!-- 导航按钮 1："构建设置" — 选中态 -->
  <rect x="12" y="41" width="104" height="34" class="brand-active" rx="6"/>
  <text x="64" y="63" class="nav-btn-text brand-active-text" text-anchor="middle">构建设置</text>

  <!-- 导航按钮 2："版本管理" — 未选中 -->
  <text x="148" y="63" class="nav-btn-text nav-default-text">版本管理</text>

  <!-- 分隔竖线 -->
  <line x1="236" y1="47" x2="236" y2="69" class="separator"/>

  <!-- 导航按钮 3："构建历史" — 未选中 -->
  <text x="264" y="63" class="nav-btn-text nav-default-text">构建历史</text>

  <!-- 导航按钮 4："高级" — 未选中 -->
  <text x="352" y="63" class="nav-btn-text nav-default-text">高级</text>

  <!-- ============== 内容区域 ============== -->
  <rect x="0" y="82" width="960" height="638" class="bg-content"/>

  <!-- ============== 构建设置 - 卡片 ============== -->
  <rect x="16" y="98" width="928" height="524" class="bg-card" rx="8"/>
  <rect x="16" y="98" width="928" height="524" class="border-card" rx="8"/>

  <!-- 卡片标题 -->
  <text x="36" y="126" class="section-title">构建设置</text>

  <!-- === 行 1: Target + Platform === -->
  <text x="36" y="156" class="label-text">构建目标 (Target)</text>
  <rect x="36" y="164" width="200" height="30" class="combo-bg"/>
  <text x="46" y="183" class="combo-text">editor</text>
  <use href="#chevron-down" x="222" y="174"/>

  <text x="262" y="156" class="label-text">平台 (Platform)</text>
  <rect x="262" y="164" width="200" height="30" class="combo-bg"/>
  <text x="272" y="183" class="combo-text">windows</text>
  <use href="#chevron-down" x="448" y="174"/>

  <text x="488" y="156" class="label-text">架构 (Arch)</text>
  <rect x="488" y="164" width="200" height="30" class="combo-bg"/>
  <text x="498" y="183" class="combo-text">x86_64</text>
  <use href="#chevron-down" x="674" y="174"/>

  <!-- === 行 2: 脚本语言 + 并行任务数 === -->
  <text x="36" y="218" class="label-text">脚本语言</text>
  <rect x="36" y="226" width="200" height="30" class="combo-bg"/>
  <text x="46" y="245" class="combo-text">GDScript / GDExtension</text>
  <use href="#chevron-down" x="222" y="236"/>

  <text x="262" y="218" class="label-text">并行编译任务数</text>
  <rect x="262" y="226" width="80" height="30" class="input-bg"/>
  <text x="272" y="245" class="combo-text">8</text>

  <!-- === 行 3: 复选框区域 === -->
  <rect x="36" y="280" width="14" height="14" class="checkbox-box"/>
  <text x="58" y="292" class="label-text">使用 MinGW 编译</text>

  <rect x="210" y="280" width="14" height="14" class="checkbox-box"/>
  <text x="232" y="292" class="label-text">启用 Windows 可选依赖</text>

  <rect x="460" y="280" width="14" height="14" class="checkbox-checked"/>
  <use href="#check" x="463" y="284.5"/>
  <text x="482" y="292" class="label-text">跳过编译（仅打包）</text>

  <rect x="36" y="310" width="14" height="14" class="checkbox-checked"/>
  <use href="#check" x="39" y="314.5"/>
  <text x="58" y="322" class="label-text">自动安装 SCons</text>

  <rect x="210" y="310" width="14" height="14" class="checkbox-checked"/>
  <use href="#check" x="213" y="314.5"/>
  <text x="232" y="322" class="label-text">打包前清理输出目录</text>

  <rect x="460" y="310" width="14" height="14" class="checkbox-checked"/>
  <use href="#check" x="463" y="314.5"/>
  <text x="482" y="322" class="label-text accent" style="font-weight: 600;">构建成功后自动更新版本号（patch +1）</text>

  <!-- === 行 4: 路径设置 === -->
  <text x="36" y="358" class="label-text">MinGW 前缀路径</text>
  <rect x="36" y="366" width="400" height="30" class="input-bg"/>
  <text x="46" y="385" class="hint-text mono">C:\msys64\mingw64\bin\</text>

  <text x="36" y="414" class="label-text">自定义包名</text>
  <rect x="36" y="422" width="400" height="30" class="input-bg"/>
  <text x="46" y="441" class="hint-text mono">godot-editor-windows-x86_64</text>

  <text x="36" y="470" class="label-text">输出目录</text>
  <rect x="36" y="478" width="400" height="30" class="input-bg"/>
  <text x="46" y="497" class="combo-text mono">H:\Godot-Editor\bin\</text>

  <text x="36" y="526" class="label-text">日志目录</text>
  <rect x="36" y="534" width="400" height="30" class="input-bg"/>
  <text x="46" y="553" class="combo-text mono">H:\Godot-Editor\logs\</text>

  <!-- 额外 SCons 参数 -->
  <text x="462" y="358" class="label-text">额外 SCons 参数</text>
  <rect x="462" y="366" width="400" height="30" class="input-bg"/>
  <text x="472" y="385" class="hint-text">module_mono_enabled=yes</text>

  <!-- 界面语言 -->
  <text x="462" y="414" class="label-text">界面语言</text>
  <rect x="462" y="422" width="200" height="30" class="combo-bg"/>
  <text x="472" y="441" class="combo-text">中文 (zh_CN)</text>
  <use href="#chevron-down" x="648" y="432"/>

  <!-- 底部操作区 -->
  <rect x="36" y="584" width="888" height="1" class="separator"/>
  <rect x="620" y="598" width="100" height="32" class="btn-ghost"/>
  <text x="670" y="618" class="btn-ghost-text" text-anchor="middle">重置默认</text>

  <rect x="736" y="598" width="180" height="32" class="btn-primary"/>
  <text x="826" y="618" class="btn-primary-text" text-anchor="middle">▶  开始构建 Godot</text>

  <!-- ============== 底部状态栏 ============== -->
  <rect x="0" y="700" width="960" height="20" class="bg-titlebar"/>
  <rect x="0" y="700" width="960" height="1" class="separator"/>
  <text x="12" y="714" class="hint-text">就绪 — 构建目标: editor | 平台: windows | 架构: x86_64</text>
  <text x="900" y="714" class="hint-text" text-anchor="end">v1.0</text>

  <!-- ============== 版本管理页签预览（半透明提示已切页）============= -->
  <!-- 不绘制其他页签内容，只在导航栏体现可切换 -->

  <!-- ============== 导航切换说明标注 ============== -->
  <!-- 提示箭头 -->
  <line x1="120" y1="90" x2="148" y2="88" class="accent" style="stroke-width: 1; stroke-dasharray: 3 3;"/>
  <line x1="200" y1="90" x2="264" y2="88" class="accent" style="stroke-width: 1; stroke-dasharray: 3 3;"/>
  <line x1="292" y1="90" x2="352" y2="88" class="accent" style="stroke-width: 1; stroke-dasharray: 3 3;"/>

  <!-- ============== 图例 ============== -->
  <rect x="672" y="647" width="272" height="46" class="bg-card" rx="6"/>
  <rect x="672" y="647" width="272" height="46" class="border-card" rx="6"/>
  <rect x="684" y="658" width="16" height="16" rx="3" class="brand-active"/>
  <text x="706" y="671" class="hint-text">选中导航按钮（蓝色填充 + 白字）</text>
  <text x="684" y="688" class="hint-text">点击即可切换：构建设置 / 版本管理 / 构建历史 / 高级</text>
</svg>
